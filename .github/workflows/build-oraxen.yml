# Manual build workflow for authorized Oraxen license holders.
name: Build Oraxen (authorized use)

on:
  workflow_dispatch:
    inputs:
      minecraft_version:
        description: "Minecraft version for the Gradle run configuration (build does not launch a server)"
        required: true
        default: "1.21.11"
        type: string

permissions:
  contents: read

concurrency:
  group: oraxen-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile Oraxen
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out Oraxen source
        uses: actions/checkout@v4
        with:
          repository: oraxen/oraxen
          ref: master
          path: oraxen-source
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Java 25 for modern NMS module
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Make Gradle wrapper executable
        working-directory: oraxen-source
        run: chmod +x ./gradlew

      - name: Build plugin JAR
        working-directory: oraxen-source
        env:
          ORAXEN_BUILD_VERSION: ${{ inputs.minecraft_version }}
        run: ./gradlew --no-daemon clean shadowJar -PmcVersion="${ORAXEN_BUILD_VERSION}"

      - name: Verify output
        working-directory: oraxen-source
        shell: bash
        run: |
          set -euo pipefail
          test -s build/libs/oraxen-*.jar
          ls -lh build/libs/oraxen-*.jar

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: oraxen-build-${{ inputs.minecraft_version }}-${{ github.run_number }}
          path: oraxen-source/build/libs/oraxen-*.jar
          if-no-files-found: error
          retention-days: 3
