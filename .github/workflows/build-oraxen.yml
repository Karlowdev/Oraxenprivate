
# Manual build workflow for authorized Oraxen license holders.
name: Build Oraxen (authorized use)

on:
  workflow_dispatch:
    inputs:
      minecraft_version:
        description: "Minecraft version for the Gradle run configuration (build does not launch a server)"
        required: true
        default: "1.21.11"
        type: string

permissions:
  contents: read

concurrency:
  group: oraxen-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile Oraxen
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out Oraxen source
        uses: actions/checkout@v4
        with:
          repository: oraxen/oraxen
          ref: master
          path: oraxen-source
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Java 25 for modern NMS module
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Make Gradle wrapper executable
        working-directory: oraxen-source
        run: chmod +x ./gradlew

      - name: Build plugin JAR
        working-directory: oraxen-source
        env:
          ORAXEN_BUILD_VERSION: ${{ inputs.minecraft_version }}
        run: ./gradlew --no-daemon clean shadowJar -PmcVersion="${ORAXEN_BUILD_VERSION}"

      - name: Verify output
        id: verify
        working-directory: oraxen-source
        shell: bash
        run: |
          set -euo pipefail

          echo "Generated JAR files:"
          ls -lh build/libs/

          mapfile -t jars < <(
            find build/libs -maxdepth 1 -type f \
              -name 'oraxen-*.jar' \
              ! -name '*-plain.jar' \
              ! -name '*-sources.jar' \
              ! -name '*-javadoc.jar'
          )

          if [[ ${#jars[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one plugin JAR, found ${#jars[@]}"
            exit 1
          fi

          JAR="${jars[0]}"

          if [[ ! -s "$JAR" ]]; then
            echo "::error::Plugin JAR is empty"
            exit 1
          fi

          echo "Verified plugin JAR:"
          ls -lh "$JAR"

          echo "jar_path=oraxen-source/$JAR" >> "$GITHUB_OUTPUT"

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: oraxen-build-${{ inputs.minecraft_version }}-${{ github.run_number }}
          path: ${{ steps.verify.outputs.jar_path }}
          if-no-files-found: error
          retention-days: 3
          
